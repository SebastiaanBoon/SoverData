[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soverdata"
version = "0.1.0"
description = "A portable, sovereign data platform"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "duckdb>=0.10.0",
    "deltalake>=0.17.0",
    "fsspec>=2024.2.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "gitpython>=3.1.40",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.0",
    "watchfiles>=0.21.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
soverdata = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "cli*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.sql"]
