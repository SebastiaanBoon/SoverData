name: Deploy SoverData to Azure

on:
  push:
    branches:
      - SoverData-Claude-Sonnet-4.6
      - SoverData-GPT-5.3-Codex
      - SoverData-Gemini-3.5-Flash

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set deployment vars
        run: |
          case "${{ github.ref_name }}" in
            SoverData-Claude-Sonnet-4.6) APP=soverdata-claude-sonnet-46 ;;
            SoverData-GPT-5.3-Codex)    APP=soverdata-gpt-53-codex ;;
            SoverData-Gemini-3.5-Flash) APP=soverdata-gemini-35-flash ;;
          esac
          echo "APP_NAME=$APP" >> $GITHUB_ENV
          echo "IMAGE_BASE=${{ secrets.ACR_LOGIN_SERVER }}/$APP" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}:cache,mode=max

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Service
        run: |
          az webapp config appsettings set \
            --resource-group cafeboonresourcegroup \
            --name ${{ env.APP_NAME }} \
            --settings \
              WEBSITES_PORT=8000 \
              PORT=8000 \
              SOVERDATA_WORKSPACE=examples/demo-workspace \
              WEBSITES_CONTAINER_START_TIME_LIMIT=600 \
            --output none
          az webapp config set \
            --resource-group cafeboonresourcegroup \
            --name ${{ env.APP_NAME }} \
            --startup-file "bash /home/site/wwwroot/startup.sh" \
            --output none
          az webapp config container set \
            --resource-group cafeboonresourcegroup \
            --name ${{ env.APP_NAME }} \
            --docker-custom-image-name ${{ env.IMAGE_BASE }}:${{ github.sha }} \
            --docker-registry-server-url https://${{ secrets.ACR_LOGIN_SERVER }} \
            --docker-registry-server-user ${{ secrets.ACR_USERNAME }} \
            --docker-registry-server-password ${{ secrets.ACR_PASSWORD }} \
            --output none
          az webapp restart \
            --resource-group cafeboonresourcegroup \
            --name ${{ env.APP_NAME }} \
            --output none

      - name: Wait for app to come up
        run: |
          URL="https://${{ env.APP_NAME }}.azurewebsites.net/"
          for i in {1..40}; do
            BODY=$(curl -sS -L --max-time 15 "$URL" 2>/dev/null || echo "")
            if echo "$BODY" | grep -qi "soverdata"; then
              echo "App is live (attempt $i)"
              exit 0
            fi
            STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" --max-time 15 "$URL" 2>/dev/null || echo "000")
            echo "Attempt $i/40: status=$STATUS, waiting 15s..."
            sleep 15
          done
          echo "App did not come up after 10 minutes"
          exit 1
