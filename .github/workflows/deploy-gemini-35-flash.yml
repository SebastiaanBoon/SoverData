name: Deploy SoverData Gemini 3.5 Flash to Azure

on:
  push:
    branches:
      - SoverData-Gemini-3.5-Flash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Zip and deploy to Azure Web App
        run: |
          zip -r deploy.zip . \
            --exclude "*.git*" \
            --exclude ".venv/*" \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude "examples/demo-workspace/lakehouse/*" \
            --exclude "examples/demo-workspace/runs/*" \
            --exclude "examples/demo-workspace/sales.db" \
            --exclude "*.parquet" \
            --exclude "*.snappy.parquet"
          az webapp deploy \
            --name soverdata-gemini-35-flash \
            --resource-group cafeboonresourcegroup \
            --src-path deploy.zip \
            --type zip \
            --async false
