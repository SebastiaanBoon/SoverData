name: Deploy SoverData to Azure (Docker)

on:
  push:
    branches:
      - SoverData-Claude-Sonnet-4.6
      - SoverData-GPT-5.3-Codex
      - SoverData-Gemini-3.5-Flash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set deployment vars
        run: |
          case "${{ github.ref_name }}" in
            SoverData-Claude-Sonnet-4.6) APP=soverdata-claude-sonnet-46 ;;
            SoverData-GPT-5.3-Codex)    APP=soverdata-gpt-53-codex ;;
            SoverData-Gemini-3.5-Flash) APP=soverdata-gemini-35-flash ;;
          esac
          echo "APP_NAME=$APP" >> $GITHUB_ENV
          echo "IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/$APP:latest" >> $GITHUB_ENV

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Service container
        run: |
          az webapp config appsettings set \
            --resource-group cafeboonresourcegroup \
            --name ${{ env.APP_NAME }} \
            --settings WEBSITES_PORT=8000 SOVERDATA_WORKSPACE=examples/demo-workspace
          az webapp config container set \
            --resource-group cafeboonresourcegroup \
            --name ${{ env.APP_NAME }} \
            --docker-custom-image-name ${{ env.IMAGE }} \
            --docker-registry-server-url https://${{ secrets.ACR_LOGIN_SERVER }} \
            --docker-registry-server-user ${{ secrets.ACR_USERNAME }} \
            --docker-registry-server-password ${{ secrets.ACR_PASSWORD }}

      - name: Wait for app to start
        run: |
          URL="https://${{ env.APP_NAME }}.azurewebsites.net/api/workspace"
          for i in {1..40}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "App is live! status=$STATUS"
              exit 0
            fi
            echo "Attempt $i/40 status=$STATUS"
            sleep 15
          done
          echo "App did not respond after 10 minutes"
          exit 1
