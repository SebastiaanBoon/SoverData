name: Deploy SoverData Claude Sonnet 4.6 to Azure

on:
  push:
    branches:
      - SoverData-Claude-Sonnet-4.6

concurrency:
  group: soverdata-claude-sonnet-46-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: soverdata/ui/package-lock.json

      - name: Build UI
        working-directory: soverdata/ui
        run: |
          npm ci
          npm run build

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure App Service
        run: |
          az webapp config appsettings set \
            --resource-group cafeboonresourcegroup \
            --name soverdata-claude-sonnet-46 \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true WEBSITE_RUN_FROM_PACKAGE=0 \
            --output none

      - name: Zip and deploy to Azure Web App
        run: |
          cd soverdata
          zip -r ../deploy.zip . \
            -x "*.git*" -x "*__pycache__*" -x "*.pyc" \
            -x "ui/node_modules/*" -x ".venv/*" -x "antenv/*" \
            -x "pyproject.toml"
          az webapp deploy \
            --resource-group cafeboonresourcegroup \
            --name soverdata-claude-sonnet-46 \
            --src-path ../deploy.zip \
            --type zip \
            --async true

      - name: Wait for app to come up
        run: |
          URL="https://soverdata-claude-sonnet-46.azurewebsites.net/"
          for i in {1..40}; do
            BODY=$(curl -sS -L --max-time 15 "$URL" 2>/dev/null || echo "")
            if echo "$BODY" | grep -qi "soverdata\|SoverData"; then
              echo "App is up and serving SoverData (attempt $i)"
              exit 0
            fi
            STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" --max-time 15 "$URL" 2>/dev/null || echo "000")
            echo "Waiting... attempt $i/40 (status=$STATUS, not SoverData yet)"
            sleep 15
          done
          echo "App did not respond with SoverData content in time"
          exit 1
