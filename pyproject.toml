[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soverdata"
version = "0.1.0"
description = "A portable, sovereign data platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "duckdb>=0.10.0",
    "deltalake>=0.16.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "croniter>=2.0.0",
    "jinja2>=3.1.0"
]

[project.scripts]
soverdata = "cli.main:main"

[tool.setuptools]
packages = ["soverdata", "server", "cli", "server.api", "server.engine", "server.workspace", "server.orchestrator"]

